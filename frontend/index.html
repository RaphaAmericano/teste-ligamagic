<html>
    <head>
        <meta charset="UTF-8">
        <title>Portal Ligamagic</title>
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <main>
            <div>
                <h1>Bem vindo ao Portal Ligamagic</h1>
            </div>
            <div>
                <h2>Login</h2>
                <form class="main-form login-form">
                    <div>
                        <label for="email">email</label>
                        <input name="email" type="email">
                    </div>
                    <div>
                        <label for="password">senha</label>
                        <input name="password" type="password">
                    </div>
                    <button id="loginSubmitButton" type="submit" data-action="login">Entrar</button>
                </form>
                <div class="loader hidden">
                    <h4>Carregando...</h4>
                </div>
            </div>
            <div>
                <h3>Não possui cadastro?</h3>
                <a href="./signin.html">Cadastre-se!</a>
            </div>
        </main>
    </body>
    
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/login_signin.js"></script>
</html>
