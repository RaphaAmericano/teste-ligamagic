<html>
    <head>
        <meta charset="UTF-8">
        <title>Portal Ligamagic - Dashboard</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <nav>
            <button id="logout-button" type="button">Sair</button>
        </nav>
        <main>
            <div>
                <h1>Bem vindo ao Portal Ligamagic</h1>
            </div>
            <div>
                <h2>Lista de cartas</h2>
                <div>
                    <a href="./card.html">Adicionar carta</a>
                </div>
                <div>
                    <table id="cardListTable">
                        <thead>
                            <tr>
                                <th scope="col">Nome (Português)</th>
                                <th scope="col">Nome (Inglês)</th>
                                <th scope="col">Card Game</th>
                                <th scope="col">Edição</th>
                                <th scope="col">Raridade</th>
                                <th scope="col">Imagem</th>
                                <th scope="col">Editar</th>
                                <th scope="col">Excluir</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                        </tbody>
                        <tfoot>
                            <tr>
                                <th scope="row"></th>
                                <td id="totalCount">Total: </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            <div id="deleteModal">
                <nav><button>X</button></nav>
                <form id="deleteForm">
                    <label for="id">Deseja realmente apagar a carta?</label>
                    <input type="hidden" name="id">
                    <span>Essa ação não pode ser desfeita</span>

                    <button type="submit">Sim</button>
                </form>
            </div>
        </main>
    </body>
    
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/dashboard.js"></script>
</html>
